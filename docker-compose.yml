# docker compose configuration defines local development stack

# docker network config
networks:
    main:
        driver: bridge

services:
    # composer for managing backend dependencies
    composer:
        image: composer:latest
        container_name: private_chat_composer
        working_dir: /app
        mem_limit: 1g
        volumes:
            - ./backend:/app
        command: composer install

    # mysql database container
    mysql:
        image: mysql:8.0.43
        container_name: private_chat_mysql
        restart: always
        mem_limit: 1g
        environment:
            - MYSQL_ROOT_PASSWORD=root
        volumes:
            - ./backend/.docker/config/mysqld.conf:/etc/mysql/mysql.conf.d/mysqld.cnf
            - ./services-data/mysql-database:/var/lib/mysql
            - ./services-data/log:/var/log
        ports:
            - "3306:3306"
        networks:
            - main

    # redis cache container
    redis:
        image: redis:8.2
        container_name: private_chat_redis
        restart: always
        mem_limit: 1g
        volumes:
            - ./services-data/redis-data:/data
        ports:
            - "6379:6379"
        networks:
            - main
        command: ["redis-server", "--requirepass", "redis_test_password"]

    # backend server container
    php:
        build:
            context: .
            dockerfile: ./backend/.docker/Dockerfile.dev
        container_name: private_chat_backend
        restart: always
        mem_limit: 1g
        depends_on:
            - mysql
            - redis
        environment:
            - DATABASE_HOST=mysql
            - REDIS_HOST=redis
        volumes:
            - ./backend/.docker/config/apache.conf:/etc/apache2/sites-available/000-default.conf
            - ./backend/.docker/config/php.ini:/usr/local/etc/php/php.ini
            - ./services-data/log:/var/log
            - ./backend/:/var/www
        ports:
            - "1337:80"
        networks:
            - main

    # frontend server container
    node:
        image: node:22
        restart: always
        container_name: private_chat_frontend
        working_dir: /app
        mem_limit: 1g
        depends_on:
            - mysql
            - redis
            - php
        volumes:
            - ./frontend:/app
        ports:
            - "80:80"
        networks:
            - main
        command: npm run dev

when@dev:
    nelmio_api_doc:
        documentation:
            info:
                title: 'Private Chat API'
                description: 'Private chat REST-API documentation'
                version: '%env(APP_VERSION)%'

            # api servers
            servers:
                # testing dev env
                - url: 'http://localhost:1337'
                  description: 'Local development environment'
                # live production system server url
                - url: 'https://private-chat.becvar.xyz'
                  description: 'Production server'

            # security components
            components:
                securitySchemes:
                    XApiToken:
                        type: apiKey
                        in: header
                        name: X-API-TOKEN
                        description: 'API Access Token'
                        required: true

            # include security components
            security:
                - XApiToken: []     # API Access Token (validate request)

            # static docs
            paths:
                # JWT login api endpoint documentation
                /api/auth/login:
                    post:
                        tags: ['Auth']
                        summary: User login action
                        description: User login for get JWT auth token
                        requestBody:
                            required: true
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            username:
                                                type: username
                                                default: test
                                            password:
                                                type: string
                                                default: test
                        responses:
                            204:
                                description: Successful login (return token)
                                headers:
                                    Set-Cookie:
                                        description: "HttpOnly cookie `BEARER` containing JWT token"
                                        schema:
                                            type: string
                                            example: "BEARER=eyJhbGciOi...; Path=/; HttpOnly; Secure; SameSite=Lax"
                            401:
                                description: Invalid credentials
                                content:
                                    application/json:
                                        examples:
                                            unauthorized:
                                                summary: Invalid credentials response
                                                value:
                                                    error: "Invalid credentials"
                            400:
                                description: Bad request body data
                                content:
                                    application/json:
                                        examples:
                                            bad_request:
                                                summary: Example of bad request response
                                                value:
                                                    error: "Missing username or password"

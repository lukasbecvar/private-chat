# publisher for building and publishing docker image to github packages container registry
name: Backend docker image builder

on:
  release:
    types:
      - created

jobs:
  build-and-push-docker-image:
    name: Backend docker image builder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # login to container registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setup php interpreter for composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      # install composer dependencies
      - name: Install backend dependencies
        run: composer install --ignore-platform-reqs --no-interaction --no-progress

      # build and push docker image
      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with:
          file: ./backend/.docker/Dockerfile.prod
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/private-chat-backend:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/private-chat-backend:latest

# static code analyse with eslint
name: ESLint

on:
  push:
    branches:
      - main
      - dev

jobs:
  eslint:
    name: ESLint analyse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      # checkout repo
      - name: Checkout repository
        uses: actions/checkout@v2

      # setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # install npm dependencies
      - name: Install dependencies
        run: npm install

      # run ESLint
      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx
